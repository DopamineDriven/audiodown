[package]
edition = "2024"

description = "Rust powered MP3/WAV metadata, PCM decoding and waveform peaks for Node"
license     = "MIT"
name        = "audiodown"
repository  = "https://github.com/DopamineDriven/audiodown"
version     = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
encoding_rs = "0.8"
napi = { version = "3.0.0", features = ["napi8"] }
napi-derive = "3.0.0"
rayon = "1.11"
symphonia = { version = "0.5.5", default-features = false, features = [
  "mpa",
  "wav",
  "pcm",
  "adpcm",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"

[package]
edition = "2024"

description = "Rust powered MP3/WAV metadata, PCM decoding and waveform peaks for Node"
license     = "MIT"
name        = "audiodown"
repository  = "https://github.com/DopamineDriven/audiodown"
version     = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
encoding_rs = "0.8.42"
napi = { version = "3.13.0", features = ["napi10", "tokio_rt"] }
napi-derive = "3.6.9"
rayon = "1.12.0"
symphonia = { version = "0.6.1", default-features = false, features = [
  "mpa",
  "wav",
  "pcm",
  "adpcm",
  "id3v1",
  "id3v2",
  "opt-simd",
] }

[build-dependencies]
napi-build = "2.5.0"

[profile.release]
lto   = true
strip = "symbols"
